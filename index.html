<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gratuity Calculator</title>
<style>
  :root{--bg:#fff;--fg:#1a1a1a;--mute:#767676;--line:#e3e3e3;--acc:#0f766e;--card:#f6f8f8}
  @media (prefers-color-scheme:dark){:root{--bg:#111;--fg:#eee;--mute:#8d8d8d;--line:#2c2c2c;--acc:#2dd4bf;--card:#1a1c1c}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  main{max-width:420px;margin:0 auto;padding:32px 20px 48px}
  h1{font-size:22px;font-weight:600;margin:0 0 4px}
  .sub{color:var(--mute);font-size:14px;margin:0 0 28px}
  label{display:block;font-size:13px;color:var(--mute);margin:20px 0 6px}
  input{width:100%;font:inherit;font-size:17px;padding:13px 14px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--fg);outline:none;-webkit-appearance:none}
  input:focus{border-color:var(--acc)}
  .hide{display:none}
  .err{color:#c0392b;font-size:13px;margin-top:6px;min-height:1em}
  .card{background:var(--card);border-radius:14px;padding:6px 16px;margin-top:28px}
  .row{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);font-size:15px}
  .row:last-child{border:0}
  .row span:first-child{color:var(--mute)}
  .row span:last-child{text-align:right;font-weight:500}
  .total{padding:16px 0}
  .total span:last-child{font-size:24px;font-weight:700;color:var(--acc)}
</style>
</head>
<body>
<main>
  <h1>Gratuity Calculator</h1>
  <p class="sub">For daily rated workers and monthly salaried staff</p>

  <label for="type">Type of staff</label>
  <input id="type" list="types" placeholder="Type d or m" autocomplete="off" autocapitalize="off">
  <datalist id="types"><option value="Daily rated worker"><option value="Monthly salaried staff"></datalist>

  <label for="doj">Date of joining</label>
  <input id="doj" class="date" inputmode="numeric" placeholder="dd-mm-yyyy" maxlength="10" autocomplete="off">

  <label for="dor">Date of retirement</label>
  <input id="dor" class="date" inputmode="numeric" placeholder="dd-mm-yyyy" maxlength="10" autocomplete="off">

  <div id="salBox" class="hide">
    <label for="sal">Last drawn monthly salary (₹)</label>
    <input id="sal" inputmode="decimal" placeholder="0">
  </div>

  <div class="err" id="err"></div>
  <div class="card hide" id="out"></div>
</main>

<script>
const $ = id => document.getElementById(id);
const TYPES = [{k:'daily',label:'Daily rated worker'},{k:'monthly',label:'Monthly salaried staff'}];
// Wage schedule is loaded from wage-schedule.md (same folder)
let WAGES = null;
const MON = {jan:0,feb:1,mar:2,apr:3,may:4,jun:5,jul:6,aug:7,sep:8,oct:9,nov:10,dec:11};
function parseWageDate(s){
  s = s.trim();
  let m = /^(\d{1,2})[-\s\/]([A-Za-z]{3})[a-z]*[-\s\/](\d{4})$/.exec(s);
  if(m && MON[m[2].toLowerCase()]!==undefined) return new Date(+m[3], MON[m[2].toLowerCase()], +m[1]);
  m = /^(\d{1,2})-(\d{1,2})-(\d{4})$/.exec(s);
  return m ? new Date(+m[3], +m[2]-1, +m[1]) : null;
}
fetch('wage-schedule.md', {cache:'no-cache'})
  .then(r => { if(!r.ok) throw 0; return r.text(); })
  .then(t => {
    WAGES = t.split('\n')
      .filter(l => l.trim().startsWith('|'))
      .map(l => l.split('|').slice(1,-1).map(c => c.trim()))
      .map(([d,w]) => ({date: parseWageDate(d||''), wage: parseFloat((w||'').replace(/,/g,''))}))
      .filter(x => x.date && x.wage > 0)
      .sort((a,b) => a.date - b.date);
    if(!WAGES.length) WAGES = null;
  })
  .catch(() => { WAGES = null; })
  .finally(() => update());

const inr = n => '₹' + n.toLocaleString('en-IN',{maximumFractionDigits:2});
const plural = (n,w) => n + ' ' + w + (n===1?'':'s');

function getType(){
  const v = $('type').value.trim().toLowerCase();
  const t = TYPES.find(t => t.label.toLowerCase() === v);
  return t && t.k;
}
function parseDate(s){
  const m = /^(\d{2})-(\d{2})-(\d{4})$/.exec(s);
  if(!m) return null;
  const d=+m[1], mo=+m[2], y=+m[3], dt=new Date(y,mo-1,d);
  return (dt.getFullYear()===y && dt.getMonth()===mo-1 && dt.getDate()===d) ? dt : null;
}
function period(a,b){
  let y=b.getFullYear()-a.getFullYear(), m=b.getMonth()-a.getMonth(), d=b.getDate()-a.getDate();
  if(d<0){ m--; d += new Date(b.getFullYear(), b.getMonth(), 0).getDate(); }
  if(m<0){ y--; m+=12; }
  if(d>=15) m++;
  if(m===12){ y++; m=0; }
  return {y,m,eff: m>=6 ? y+1 : y};
}

// type field: autofill on typing
$('type').addEventListener('input', e => {
  if(!(e.inputType||'').startsWith('delete')){
    const v = e.target.value.trim().toLowerCase();
    if(v){
      const t = TYPES.find(t => t.label.toLowerCase().startsWith(v));
      if(t) e.target.value = t.label;
    }
  }
  update();
});
$('type').addEventListener('focus', e => { if(getType()) e.target.select(); });

// date fields: auto dashes
document.querySelectorAll('.date').forEach(el => el.addEventListener('input', e => {
  const d = e.target.value.replace(/\D/g,'').slice(0,8);
  let s = d.slice(0,2);
  if(d.length>2) s += '-' + d.slice(2,4);
  if(d.length>4) s += '-' + d.slice(4);
  e.target.value = s;
  update();
}));
$('sal').addEventListener('input', update);

function update(){
  const type = getType(), err = $('err'), out = $('out');
  $('salBox').classList.toggle('hide', type!=='monthly');
  err.textContent = ''; out.classList.add('hide');
  if(!type || $('doj').value.length<10 || $('dor').value.length<10) return;

  const a = parseDate($('doj').value), b = parseDate($('dor').value);
  if(!a || !b){ err.textContent = 'Please enter valid dates.'; return; }
  if(b<=a){ err.textContent = 'Retirement date must be after joining date.'; return; }

  const p = period(a,b);
  let rows = `<div class="row"><span>Total working period</span><span>${plural(p.y,'year')} ${plural(p.m,'month')}</span></div>
              <div class="row"><span>Effective working period</span><span>${plural(p.eff,'year')}</span></div>`;
  let gratuity;

  if(type==='daily'){
    if(!WAGES){ err.textContent = 'Could not load wage-schedule.md. Check the file is in the same folder.'; return; }
    const w = [...WAGES].reverse().find(x => x.date <= b);
    if(!w){ err.textContent = 'No wage rate available for retirement before 01-Apr-2011.'; return; }
    rows += `<div class="row"><span>Last drawn daily wage</span><span>${inr(w.wage)}</span></div>`;
    gratuity = w.wage * 15 * p.eff;
  } else {
    const s = parseFloat($('sal').value);
    if(!(s>0)) return;
    rows += `<div class="row"><span>Last drawn salary</span><span>${inr(s)}</span></div>`;
    gratuity = s * 0.5 * p.eff;
  }
  rows += `<div class="row total"><span>Gratuity</span><span>${inr(gratuity)}</span></div>`;
  out.innerHTML = rows;
  out.classList.remove('hide');
}
</script>
</body>
</html>
